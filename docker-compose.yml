services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge_forge
      POSTGRES_PASSWORD: knowledge_forge
      POSTGRES_DB: knowledge_forge
    ports:
      - "5432:5432"
    volumes:
      - knowledge_forge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_forge -d knowledge_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knowledge_forge_postgres_data:
